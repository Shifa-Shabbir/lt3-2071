<!DOCTYPE html>
<html>
<head>
<title>Form</title>
</head>
<div style="background-color: lightgrey; width: 650px;
            padding: 15px; margin: auto;">
<h1 style="text-align: center; color: red;">
        Continental Hotel Reservation Form
    </h1>
<table border="4" bgcolor="lightblue" style="margin: auto; width: 100%;">
<form>
<tr>

<th align ="right"><label for="nametext">Name:</label></th>
<td><input type="text" id="nametext"name="fname" value="enter your name"><br></td></tr>
<tr>
<th align ="right"><label for="eMail">eMail:</label></th>
<td><input type="email" value="info@continental.pk"><br></td></tr>
<tr>
<th align ="right"><label for="Mobile No">Mobile No:</label></th>
<td><input type="numbers"value="Enter your cell number"</td>
</tr>
<tr>
<th align ="right"><label for="Arrival Time">Arrival Time:</label></th>

<td><input type="time"><br></td></tr>
<tr>
<th align ="right"><label for="Deparure">Departure:</label></th>
<td><input id="departement1" type="text">
<input id="department2" type="text"></td>

</tr>
<tr>
<th align ="right"><label for="Room Type">Room Type:</label></th>
<td>
<input type="radio" name="room"> Single
<input type="radio" name="room"> Double </br>
<input type="radio" name="room"> Presidential Suite
</td>
</tr>
<tr>
<th align ="right"><label for="Preferences">Preferences:</label></th>
<td><input type="checkbox">Non-Smoking</br>
<input type="checkbox">Internet</br>
<input type="checkbox">Firm Mattress<br></td>
</tr>
<tr>
<th align ="right"><label for="Mode of Payment">Mode of Payment:</label></th>
<td><input type="checkbox">Cash
<input type="checkbox">Check<br>
<input type="checkbox">Credit Card
<input type="submit" value="Select card"> </td>
</tr>
<tr>
    <td colspan="2" style="text-align: center;">
        <input type="submit" value="Send data">
    </td>
</tr>
</form>

</table>
 </div>
</body>
